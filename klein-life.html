<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game of Life on a Klein Bottle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #07080c;
        --panel: rgba(8, 9, 13, 0.68);
        --stroke: rgba(255, 255, 255, 0.16);
        --text: #f2efe3;
        --muted: rgba(236, 234, 222, 0.8);
        --accent: #e8c98a;
        --amber: #a6773f;
        --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
      }
      body {
        font-family: var(--font-mono);
        -webkit-font-smoothing: antialiased;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
      }

      .panel {
        position: fixed;
        top: 22px;
        right: 22px;
        z-index: 10;
        width: 246px;
        max-height: calc(100vh - 44px);
        overflow-y: auto;
        overflow-x: hidden;
        overscroll-behavior: contain;
        background: var(--panel);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        color: var(--text);
        padding: 28px 24px;
        transition:
          transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.2s ease;
      }
      body.panel-hidden .panel {
        transform: translateX(120%);
        opacity: 0;
        pointer-events: none;
      }
      .panel::-webkit-scrollbar {
        width: 0;
      }

      .p-head {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 6px;
      }
      #statLine {
        display: block;
        margin-top: 26px;
        font-size: 10px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .icon-btn {
        flex: none;
        cursor: pointer;
        margin-top: 1px;
        font-family: var(--font-mono);
        font-size: 9px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--muted);
        background: transparent;
        border: 0;
        padding: 2px;
        transition: color 0.15s ease;
      }
      .icon-btn:hover {
        color: var(--text);
      }

      .rule {
        border: 0;
        border-top: 1px solid var(--stroke);
        margin: 14px 0;
      }

      .transport {
        display: flex;
        gap: 20px;
      }
      .tbtn {
        appearance: none;
        border: 0;
        cursor: pointer;
        color: var(--muted);
        background: transparent;
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 1px;
        text-transform: uppercase;
        text-align: left;
        padding: 9px 0;
        transition: color 0.15s ease;
      }
      .tbtn:hover {
        color: var(--text);
      }
      .tbtn.hero {
        color: var(--amber);
        font-weight: 500;
      }
      .tbtn.hero.playing {
        color: var(--accent);
      }

      .sliderow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 22px;
      }
      .sliderow::before {
        content: "Speed";
        font-size: 9px;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        color: var(--muted);
      }
      .sliderow input[type="range"] {
        flex: 1;
        min-width: 0;
        -webkit-appearance: none;
        appearance: none;
        height: 16px;
        background: transparent;
        cursor: pointer;
      }
      .sliderow input[type="range"]::-webkit-slider-runnable-track {
        height: 1px;
        background: linear-gradient(
          90deg,
          var(--accent) var(--fill, 40%),
          var(--stroke) var(--fill, 40%)
        );
      }
      .sliderow input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 8px;
        height: 8px;
        border-radius: 99px;
        margin-top: -3.5px;
        background: var(--text);
        border: none;
      }
      .sliderow input[type="range"]::-moz-range-track {
        height: 1px;
        background: var(--stroke);
      }
      .sliderow input[type="range"]::-moz-range-progress {
        height: 1px;
        background: var(--accent);
      }
      .sliderow input[type="range"]::-moz-range-thumb {
        width: 8px;
        height: 8px;
        border-radius: 99px;
        background: var(--text);
        border: none;
      }
      .pill-val {
        font-size: 10px;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        min-width: 30px;
        text-align: right;
      }

      .more {
        margin-top: 6px;
      }
      .label {
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 1.6px;
        color: var(--muted);
        font-weight: 400;
        margin: 24px 0 12px;
      }
      .seg {
        display: flex;
        gap: 20px;
      }
      .seg button {
        border: 0;
        padding: 0;
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.3px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        white-space: nowrap;
        transition: color 0.15s ease;
      }
      .seg button:hover {
        color: var(--text);
      }
      .seg button.active {
        color: var(--accent);
      }
      .presets {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 20px;
      }
      .preset {
        appearance: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        background: transparent;
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.3px;
        transition: color 0.15s ease;
      }
      .preset:hover {
        color: var(--text);
      }
      .switchrow {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 20px;
      }
      .switch {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        user-select: none;
        font-size: 11px;
        letter-spacing: 0.3px;
        color: var(--muted);
      }
      .switch::before {
        content: "";
        width: 7px;
        height: 7px;
        border: 1px solid var(--muted);
        flex: none;
        transition:
          background 0.15s ease,
          border-color 0.15s ease;
      }
      .switch:has(input:checked) {
        color: var(--text);
      }
      .switch:has(input:checked)::before {
        background: var(--accent);
        border-color: var(--accent);
      }
      .switch input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }

      #fab {
        position: fixed;
        top: 22px;
        right: 22px;
        z-index: 9;
        cursor: pointer;
        display: none;
        font-family: var(--font-mono);
        font-size: 9px;
        letter-spacing: 1.6px;
        text-transform: uppercase;
        color: var(--muted);
        background: transparent;
        border: 0;
        padding: 4px;
      }
      #fab:hover {
        color: var(--text);
      }
      body.panel-hidden #fab {
        display: block;
      }

      @media (max-width: 680px) {
        .panel {
          top: auto;
          bottom: 14px;
          left: 14px;
          right: 14px;
          width: auto;
          max-height: 46vh;
        }
        body.panel-hidden .panel {
          transform: translateY(120%);
        }
        #fab {
          top: auto;
          bottom: 16px;
          right: 16px;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body class="panel-hidden">
    <div id="app"></div>

    <button id="fab" title="Show controls">Menu</button>

    <div class="panel" id="panel">
      <div class="p-head">
        <button class="icon-btn" id="btnCollapse" title="Hide panel">
          Close
        </button>
      </div>

      <div class="transport">
        <button
          id="btnPlay"
          class="tbtn hero playing"
          title="Play/Pause (Space)"
        >
          Pause
        </button>
        <button id="btnStep" class="tbtn" title="Step once">Step</button>
        <button id="btnClear" class="tbtn" title="Clear">Clear</button>
        <button id="btnRandom" class="tbtn" title="Random soup">Random</button>
      </div>

      <div class="sliderow">
        <input
          id="speed"
          type="range"
          min="1"
          max="30"
          step="1"
          value="12"
          title="Speed"
        />
        <span class="pill-val" id="speedVal">12/s</span>
      </div>

      <div class="more">
        <div class="label"><span>Pattern</span></div>
        <div class="presets">
          <button class="preset" data-preset="glider">Glider</button>
          <button class="preset" data-preset="lwss">Ship</button>
          <button class="preset" data-preset="pulsar">Pulsar</button>
          <button class="preset" data-preset="gun">Gun</button>
        </div>
        <div class="label"><span>Edges</span></div>
        <div class="seg">
          <button id="btnKlein" class="active">Klein</button>
          <button id="btnTorus">Torus</button>
        </div>
        <div class="label"><span>Cells</span></div>
        <div class="seg">
          <button id="viewPaint" class="active">Glow</button>
          <button id="viewBlocks">Blocks</button>
          <button id="viewBoth">Both</button>
        </div>
        <div class="label"><span>Mouse</span></div>
        <div class="seg">
          <button id="modeRotate" class="active">Rotate</button>
          <button id="modePaint">Paint</button>
        </div>
        <div class="switchrow">
          <label class="switch"
            ><input id="erase" type="checkbox" />Erase</label
          >
          <label class="switch"
            ><input id="spin" type="checkbox" checked />Spin</label
          >
          <label class="switch"
            ><input id="crt" type="checkbox" checked />CRT</label
          >
        </div>
      </div>

      <span id="statLine">gen 0 · pop 0</span>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
      import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";

      // ================= sim (Klein wrap: going around once flips the other axis) =================
      const W = 120,
        H = 80,
        HALF_H = H / 2;
      let cur = new Uint8Array(W * H);
      let nxt = new Uint8Array(W * H);
      let topology = "klein";
      let playing = true;
      let speed = 12;
      let gen = 0;

      const mod = (a, n) => ((a % n) + n) % n;

      function getCell(x, y) {
        if (topology === "klein") {
          // Classic bottle seam: (u=0,v) ~ (u=2PI, 0.5-v).
          // In cells with centers (i+0.5)/W: j' = HALF_H-1-j (mod H) when x wraps.
          if (x < 0) {
            x += W;
            y = mod(HALF_H - 1 - y, H);
          } else if (x >= W) {
            x -= W;
            y = mod(HALF_H - 1 - y, H);
          } else y = mod(y, H);
          return cur[y * W + x];
        }
        return cur[mod(y, H) * W + mod(x, W)];
      }

      function stepLife() {
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            let n = 0;
            n += getCell(x - 1, y - 1);
            n += getCell(x, y - 1);
            n += getCell(x + 1, y - 1);
            n += getCell(x - 1, y);
            n += getCell(x + 1, y);
            n += getCell(x - 1, y + 1);
            n += getCell(x, y + 1);
            n += getCell(x + 1, y + 1);
            const alive = cur[y * W + x] === 1;
            nxt[y * W + x] =
              (alive && (n === 2 || n === 3)) || (!alive && n === 3) ? 1 : 0;
          }
        }
        const t = cur;
        cur = nxt;
        nxt = t;
        gen++;
        refreshTexture();
        refreshBlocks();
        updateStats();
      }

      function population() {
        let s = 0;
        for (let i = 0; i < cur.length; i++) s += cur[i];
        return s;
      }
      function updateStats() {
        document.getElementById("statLine").textContent =
          `gen ${gen} · pop ${population()}`;
      }
      function setRaw(x, y, v) {
        if (x < 0 || x >= W || y < 0 || y >= H) return;
        cur[y * W + x] = v;
      }
      function clearGrid() {
        cur.fill(0);
        gen = 0;
        refreshTexture();
        refreshBlocks();
        updateStats();
      }
      function randomSoup(density = 0.16) {
        for (let i = 0; i < cur.length; i++)
          cur[i] = Math.random() < density ? 1 : 0;
        gen = 0;
        refreshTexture();
        refreshBlocks();
        updateStats();
      }
      function stamp(rows, cx, cy) {
        const h = rows.length,
          w = rows[0].length;
        const x0 = cx - Math.floor(w / 2),
          y0 = cy - Math.floor(h / 2);
        for (let j = 0; j < h; j++)
          for (let i = 0; i < w; i++)
            if (rows[j][i] === "X" || rows[j][i] === "O")
              setRaw(x0 + i, y0 + j, 1);
        refreshTexture();
        refreshBlocks();
        updateStats();
      }
      const PRESETS = {
        glider: [".X.", "..X", "XXX"],
        lwss: [".X..X", "X....", "X...X", "XXXX."],
        pulsar: [
          "..XXX...XXX..",
          ".............",
          "X....X.X....X",
          "X....X.X....X",
          "X....X.X....X",
          "..XXX...XXX..",
          ".............",
          "..XXX...XXX..",
          "X....X.X....X",
          "X....X.X....X",
          "X....X.X....X",
          ".............",
          "..XXX...XXX..",
        ],
        gun: [
          "........................X...........",
          "......................X.X...........",
          "............XX......XX............XX",
          "...........X...X....XX............XX",
          "XX........X.....X...XX..............",
          "XX........X...X.XX....X.X...........",
          "..........X.....X.......X...........",
          "...........X...X....................",
          "............XX......................",
        ],
      };

      // ================= three setup =================
      const container = document.getElementById("app");
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.4;
      container.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = makeBackdropTexture();

      // a soft dark vignette instead of a flat color — deep ink at the edges,
      // a faint warm-cool glow at the center where the bottle sits
      function makeBackdropTexture() {
        const size = 512;
        const c = document.createElement("canvas");
        c.width = c.height = size;
        const ctx = c.getContext("2d");
        const g = ctx.createRadialGradient(
          size * 0.5,
          size * 0.42,
          size * 0.05,
          size * 0.5,
          size * 0.5,
          size * 0.72,
        );
        g.addColorStop(0, "#11151f");
        g.addColorStop(0.45, "#0a0c13");
        g.addColorStop(1, "#050608");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, size, size);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }
      const camera = new THREE.PerspectiveCamera(
        42,
        window.innerWidth / window.innerHeight,
        0.1,
        200,
      );
      camera.position.set(6.38, 4.7, 9.12);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.target.set(0, 0.2, 0);
      // full orbit: no polar clamp, pan + zoom enabled
      controls.minPolarAngle = 0;
      controls.maxPolarAngle = Math.PI;
      controls.enablePan = true;
      controls.minDistance = 3;
      controls.maxDistance = 40;
      controls.autoRotateSpeed = 1.2;
      controls.autoRotate = true;

      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(
        new RoomEnvironment(renderer),
        0.35,
      ).texture;

      scene.add(new THREE.AmbientLight(0x88aaff, 0.65));
      const key = new THREE.DirectionalLight(0xffffff, 1.15);
      key.position.set(5, 8, 4);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0x66aaff, 0.85);
      rim.position.set(-6, 3, -6);
      scene.add(rim);

      // composer: restrained bloom — enough to make the life cells glow, not enough
      // to smear the glass edges
      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      const bloom = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.22,
        0.65,
        0.82,
      );
      composer.addPass(bloom);

      // VHS/CRT pass, matched to shader_reference.mp4: soft analog blur,
      // gentle chromatic-aberration fringe, fine grain and a real horizontal
      // scanline structure (smooth, multi-device-pixel period so it survives
      // HiDPI downsampling instead of averaging away) plus a subtle aperture
      // grille tint for an authentic phosphor feel.
      const vhsShader = {
        uniforms: {
          tDiffuse: { value: null },
          time: { value: 0 },
          resolution: {
            value: new THREE.Vector2(window.innerWidth, window.innerHeight),
          },
          pixelRatio: { value: renderer.getPixelRatio() },
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D tDiffuse;
          uniform float time;
          uniform vec2 resolution;
          uniform float pixelRatio;
          varying vec2 vUv;

          float rand(vec2 co) {
            return fract(sin(dot(co, vec2(12.9898, 78.233))) * 43758.5453);
          }

          void main() {
            vec2 uv = vUv;

            // rare, subtle per-line tracking jitter — most frames untouched
            float trackRoll = step(0.995, rand(vec2(floor(time * 6.0), 3.0)));
            float lineSeed = floor(uv.y * resolution.y * 0.34) + floor(time * 6.0) * 13.0;
            uv.x += (rand(vec2(lineSeed, 1.0)) - 0.5) * 0.0035 * trackRoll;

            // chromatic aberration
            float ca = 0.0022;
            float r = texture2D(tDiffuse, uv + vec2(ca, 0.0)).r;
            float g = texture2D(tDiffuse, uv).g;
            float b = texture2D(tDiffuse, uv - vec2(ca, 0.0)).b;
            vec3 color = vec3(r, g, b);

            // CRT scanlines — smooth, ~3.5 CSS-pixel period so it reads at any
            // devicePixelRatio instead of being averaged away by HiDPI downsampling
            float lineY = gl_FragCoord.y / (pixelRatio * 3.5);
            float scan = 0.5 + 0.5 * cos(lineY * 6.28318);
            color *= 1.0 - 0.16 * scan;

            // aperture-grille phosphor tint — faint per-column RGB stagger
            float colX = gl_FragCoord.x / pixelRatio;
            vec3 grille = 1.0 + 0.05 * vec3(
              sin(colX * 2.094),
              sin(colX * 2.094 + 2.094),
              sin(colX * 2.094 + 4.189)
            );
            color *= grille;

            // vignette
            vec2 vc = uv - 0.5;
            color *= 1.0 - dot(vc, vc) * 0.45;

            // slight desaturation for that washed-out tape look
            float gray = dot(color, vec3(0.299, 0.587, 0.114));
            color = mix(vec3(gray), color, 0.92);

            gl_FragColor = vec4(color, 1.0);
          }
        `,
      };
      const vhsPass = new ShaderPass(vhsShader);
      vhsPass.enabled = true; // on by default — toggled via the CRT switch
      composer.addPass(vhsPass);

      composer.addPass(new OutputPass());

      // ================= klein bottle math =================
      // The "traditional" Klein bottle immersion (Alling & Greenleaf) — the recognizable
      // bottle with a bulbous base and a neck that loops up, over, and back through the
      // wall. Built entirely from smooth periodic trig terms with no piecewise branches,
      // so the surface is provably continuous everywhere u and v wrap around — including
      // where the neck reenters the base, which is where the old piecewise formula used
      // to leave a visible seam ("the bottom" that didn't close up right).
      function kleinBottle(u, v, out = new THREE.Vector3()) {
        const cu = Math.cos(u),
          su = Math.sin(u),
          cv = Math.cos(v),
          sv = Math.sin(v);
        const cu2 = cu * cu,
          cu3 = cu2 * cu,
          cu4 = cu2 * cu2,
          cu5 = cu4 * cu,
          cu6 = cu4 * cu2,
          cu7 = cu6 * cu;
        const x =
          -(2 / 15) *
          cu *
          (3 * cv - 30 * su + 90 * cu4 * su - 60 * cu6 * su + 5 * cu * cv * su);
        const y =
          -(1 / 15) *
          su *
          (3 * cv -
            3 * cu2 * cv -
            48 * cu4 * cv +
            48 * cu6 * cv -
            60 * su +
            5 * cu * cv * su -
            5 * cu3 * cv * su -
            80 * cu5 * cv * su +
            80 * cu7 * cv * su);
        const z = (2 / 15) * (3 + 5 * cu * su) * sv;
        out.set(x, y, z); // this immersion is already upright: y is the tall axis
        return out;
      }
      const BOTTLE_SCALE = 1.55;

      // Arc-length correction for u: the raw immersion parameter doesn't move at a
      // constant physical "speed" along the bottle's main loop (it lingers in some
      // places, rushes through others), which otherwise stretches and squishes the
      // life cells unevenly. Precompute cumulative arc length once, then remap a
      // uniform grid fraction t in [0,1) to the raw u that lands at that fraction
      // of the total loop length, so equal grid steps cover equal physical distance.
      const U_TABLE_N = 720;
      const uArcTable = new Float32Array(U_TABLE_N + 1);
      {
        const p0 = new THREE.Vector3(),
          p1 = new THREE.Vector3();
        let acc = 0;
        kleinBottle(0, 0, p0);
        for (let i = 1; i <= U_TABLE_N; i++) {
          kleinBottle((i / U_TABLE_N) * Math.PI * 2, 0, p1);
          acc += p0.distanceTo(p1);
          uArcTable[i] = acc;
          p0.copy(p1);
        }
      }
      const uArcTotal = uArcTable[U_TABLE_N];
      function remapU(t) {
        const target = t * uArcTotal;
        let lo = 0,
          hi = U_TABLE_N;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (uArcTable[mid] < target) lo = mid + 1;
          else hi = mid;
        }
        const i1 = Math.max(1, lo),
          i0 = i1 - 1;
        const s0 = uArcTable[i0],
          s1 = uArcTable[i1];
        const frac = s1 > s0 ? (target - s0) / (s1 - s0) : 0;
        const u0 = (i0 / U_TABLE_N) * Math.PI * 2,
          u1 = (i1 / U_TABLE_N) * Math.PI * 2;
        return u0 + (u1 - u0) * frac;
      }

      const lifeGroup = new THREE.Group();
      lifeGroup.rotation.y = Math.PI * 0.5; // present the loop + bulb symmetrically head-on
      scene.add(lifeGroup);

      function buildKleinGeometry(uSeg = 220, vSeg = 150) {
        const positions = new Float32Array((uSeg + 1) * (vSeg + 1) * 3);
        const uvs = new Float32Array((uSeg + 1) * (vSeg + 1) * 2);
        const index = [];
        const p = new THREE.Vector3();
        let k = 0,
          t = 0;
        for (let i = 0; i <= uSeg; i++) {
          const u = remapU(i / uSeg);
          for (let j = 0; j <= vSeg; j++) {
            const v = (j / vSeg) * Math.PI * 2;
            kleinBottle(u, v, p);
            positions[k++] = p.x * BOTTLE_SCALE;
            positions[k++] = p.y * BOTTLE_SCALE;
            positions[k++] = p.z * BOTTLE_SCALE;
            uvs[t++] = i / uSeg;
            uvs[t++] = j / vSeg;
          }
        }
        for (let i = 0; i < uSeg; i++)
          for (let j = 0; j < vSeg; j++) {
            const a = i * (vSeg + 1) + j,
              b = a + vSeg + 1;
            index.push(a, b, a + 1, b, b + 1, a + 1);
          }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        g.setAttribute("uv", new THREE.BufferAttribute(uvs, 2));
        g.setIndex(index);
        g.computeVertexNormals();
        g.computeBoundingBox();
        const c = new THREE.Vector3();
        g.boundingBox.getCenter(c);
        g.translate(-c.x, -c.y, -c.z);
        return { geometry: g, center: c };
      }

      const { geometry: kleinGeo, center: bottleCenter } = buildKleinGeometry(
        220,
        150,
      );

      // the glass bottle itself
      const baseMesh = new THREE.Mesh(
        kleinGeo,
        new THREE.MeshPhysicalMaterial({
          color: 0x9ecfff,
          metalness: 0,
          roughness: 0.045,
          transmission: 1.0,
          thickness: 0.6,
          ior: 1.45,
          clearcoat: 0.6,
          clearcoatRoughness: 0.34,
          attenuationColor: new THREE.Color(0x6db3ff),
          attenuationDistance: 6,
          envMapIntensity: 1.05,
          specularIntensity: 0.6,
          side: THREE.DoubleSide,
        }),
      );
      baseMesh.renderOrder = 0;
      lifeGroup.add(baseMesh);

      // glow-paint overlay = the Life cells
      const lifeRGBA = new Uint8Array(W * H * 4);
      const lifeTex = new THREE.DataTexture(lifeRGBA, W, H, THREE.RGBAFormat);
      lifeTex.magFilter = THREE.NearestFilter;
      lifeTex.minFilter = THREE.NearestFilter;
      lifeTex.generateMipmaps = false;
      lifeTex.colorSpace = THREE.SRGBColorSpace;
      lifeTex.needsUpdate = true;

      // depthTest is off on purpose: the bottle is transmissive glass, so a cell on
      // the far side of a wall from the camera should still glow through it. With
      // depth testing on, the opaque depth buffer from baseMesh (and the imperfect
      // outward-offset trick below) was hiding cells anywhere behind another part
      // of the glass — most noticeably the surface just outside/below the handle.
      const overlayMesh = new THREE.Mesh(
        kleinGeo,
        new THREE.MeshBasicMaterial({
          map: lifeTex,
          transparent: true,
          side: THREE.DoubleSide,
          depthWrite: false,
          depthTest: false,
          toneMapped: false,
        }),
      );
      overlayMesh.scale.setScalar(1.006);
      overlayMesh.renderOrder = 2;
      lifeGroup.add(overlayMesh);

      function refreshTexture() {
        for (let i = 0; i < W * H; i++) {
          const o = i * 4;
          if (cur[i]) {
            lifeRGBA[o] = 90;
            lifeRGBA[o + 1] = 225;
            lifeRGBA[o + 2] = 255;
            lifeRGBA[o + 3] = 255;
          } else {
            lifeRGBA[o] = 0;
            lifeRGBA[o + 1] = 0;
            lifeRGBA[o + 2] = 0;
            lifeRGBA[o + 3] = 0;
          }
        }
        lifeTex.needsUpdate = true;
      }

      // chunky blocks sitting on the bottle
      const blockGeo = new THREE.BoxGeometry(0.085, 0.085, 0.085);
      const blockMat = new THREE.MeshStandardMaterial({
        color: 0x54d8ff,
        emissive: 0x1d9bd8,
        emissiveIntensity: 1.0,
        roughness: 0.3,
        metalness: 0.1,
        depthTest: false,
        depthWrite: false, // same reason as overlayMesh — glass shouldn't hide these
      });
      const blocks = new THREE.InstancedMesh(blockGeo, blockMat, W * H);
      blocks.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      blocks.frustumCulled = false;
      blocks.renderOrder = 1;
      lifeGroup.add(blocks);

      const _p = new THREE.Vector3(),
        _pu1 = new THREE.Vector3(),
        _pu2 = new THREE.Vector3();
      const _pv1 = new THREE.Vector3(),
        _pv2 = new THREE.Vector3(),
        _tu = new THREE.Vector3(),
        _tv = new THREE.Vector3(),
        _n = new THREE.Vector3();
      const _pos = new THREE.Vector3(),
        _q = new THREE.Quaternion(),
        _s = new THREE.Vector3(1, 1, 1),
        _m = new THREE.Matrix4();
      const _zAxis = new THREE.Vector3(0, 0, 1);
      const EPS = 0.015;

      function cellSurface(i, j, outPos, outQuat) {
        const u = remapU((i + 0.5) / W);
        const v = ((j + 0.5) / H) * Math.PI * 2;
        kleinBottle(u, v, _p);
        kleinBottle(u + EPS, v, _pu1);
        kleinBottle(u - EPS, v, _pu2);
        kleinBottle(u, mod(v + EPS, Math.PI * 2), _pv1);
        kleinBottle(u, mod(v - EPS, Math.PI * 2), _pv2);
        _tu.subVectors(_pu1, _pu2);
        _tv.subVectors(_pv1, _pv2);
        _n.crossVectors(_tu, _tv);
        if (_n.lengthSq() < 1e-8) _n.set(0, 1, 0);
        else _n.normalize();
        outPos
          .copy(_p)
          .multiplyScalar(BOTTLE_SCALE)
          .sub(bottleCenter)
          .addScaledVector(_n, 0.06);
        outQuat.setFromUnitVectors(_zAxis, _n);
      }

      let viewMode = "paint";
      function refreshBlocks() {
        if (viewMode === "paint") {
          blocks.count = 0;
          blocks.instanceMatrix.needsUpdate = true;
          return;
        }
        let c = 0;
        for (let j = 0; j < H; j++) {
          for (let i = 0; i < W; i++) {
            if (!cur[j * W + i]) continue;
            cellSurface(i, j, _pos, _q);
            _m.compose(_pos, _q, _s);
            blocks.setMatrixAt(c++, _m);
          }
        }
        blocks.count = c;
        blocks.instanceMatrix.needsUpdate = true;
      }
      function applyView() {
        overlayMesh.visible = viewMode === "paint" || viewMode === "both";
        blocks.visible = viewMode !== "paint";
        refreshBlocks();
      }

      // ================= painting =================
      const raycaster = new THREE.Raycaster();
      const pointerNDC = new THREE.Vector2();
      let eraseMode = false;

      function paintAtUV(uv, value) {
        const gx = Math.min(W - 1, Math.max(0, Math.floor(uv.x * W)));
        const gy = Math.min(H - 1, Math.max(0, Math.floor(uv.y * H)));
        cur[gy * W + gx] = value;
        // paint a small 3x3 blob so bottle strokes are visible (cells are tiny on the neck)
        cur[mod(gy + 1, H) * W + gx] = value;
        cur[mod(gy - 1, H) * W + gx] = value;
        refreshTexture();
        refreshBlocks();
        updateStats();
      }
      function castToBottle(e) {
        const r = renderer.domElement.getBoundingClientRect();
        pointerNDC.set(
          ((e.clientX - r.left) / r.width) * 2 - 1,
          -((e.clientY - r.top) / r.height) * 2 + 1,
        );
        raycaster.setFromCamera(pointerNDC, camera);
        const hits = raycaster.intersectObjects([overlayMesh, baseMesh], false);
        return hits.length ? hits[0] : null;
      }

      let downPos = null;
      let painting3D = false;
      let mouseMode = "rotate"; // 'rotate' | 'paint'
      const modeRotateBtn = document.getElementById("modeRotate");
      const modePaintBtn = document.getElementById("modePaint");
      function setMouseMode(m) {
        mouseMode = m;
        modeRotateBtn.classList.toggle("active", m === "rotate");
        modePaintBtn.classList.toggle("active", m === "paint");
      }
      modeRotateBtn.addEventListener("click", () => setMouseMode("rotate"));
      modePaintBtn.addEventListener("click", () => setMouseMode("paint"));
      document.getElementById("spin").addEventListener("change", (e) => {
        controls.autoRotate = e.target.checked;
      });
      document.getElementById("crt").addEventListener("change", (e) => {
        vhsPass.enabled = e.target.checked;
      });
      renderer.domElement.addEventListener("pointerdown", (e) => {
        downPos = [e.clientX, e.clientY];
        if (mouseMode === "paint" && e.button === 0) {
          painting3D = true;
          controls.enabled = false;
          const hit = castToBottle(e);
          if (hit && hit.uv) paintAtUV(hit.uv, eraseMode ? 0 : 1);
        }
      });
      window.addEventListener("pointermove", (e) => {
        if (!painting3D) return;
        const hit = castToBottle(e);
        if (hit && hit.uv) paintAtUV(hit.uv, eraseMode ? 0 : 1);
      });
      window.addEventListener("pointerup", (e) => {
        if (painting3D) {
          painting3D = false;
          controls.enabled = true;
          return;
        }
        // single click paints only in Paint mode, so orbiting never spawns cells
        if (
          mouseMode === "paint" &&
          downPos &&
          Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]) < 6 &&
          e.target === renderer.domElement
        ) {
          const hit = castToBottle(e);
          if (hit && hit.uv) paintAtUV(hit.uv, eraseMode ? 0 : 1);
        }
        downPos = null;
      });

      // ================= UI =================
      const btnPlay = document.getElementById("btnPlay");
      function setPlaying(p) {
        playing = p;
        btnPlay.textContent = playing ? "Pause" : "Play";
        btnPlay.classList.toggle("playing", playing);
        document.body.classList.toggle("paused", !playing);
      }
      btnPlay.addEventListener("click", () => setPlaying(!playing));
      document
        .getElementById("btnCollapse")
        .addEventListener("click", () =>
          document.body.classList.add("panel-hidden"),
        );
      document
        .getElementById("fab")
        .addEventListener("click", () =>
          document.body.classList.remove("panel-hidden"),
        );
      window.addEventListener("keydown", (e) => {
        if (
          e.code === "Space" &&
          !/INPUT|TEXTAREA|BUTTON/.test(document.activeElement?.tagName || "")
        ) {
          e.preventDefault();
          setPlaying(!playing);
        }
      });
      document.getElementById("btnStep").addEventListener("click", () => {
        setPlaying(false);
        stepLife();
      });
      document.getElementById("btnClear").addEventListener("click", clearGrid);
      document
        .getElementById("btnRandom")
        .addEventListener("click", () => randomSoup(0.16));
      document.querySelectorAll("[data-preset]").forEach((b) => {
        b.addEventListener("click", () =>
          stamp(
            PRESETS[b.dataset.preset],
            Math.floor(W / 2),
            Math.floor(H / 2),
          ),
        );
      });
      const speedEl = document.getElementById("speed");
      function syncSliderFill() {
        const pct =
          ((speedEl.value - speedEl.min) / (speedEl.max - speedEl.min)) * 100;
        speedEl.style.setProperty("--fill", pct + "%");
      }
      speedEl.addEventListener("input", () => {
        speed = parseInt(speedEl.value, 10);
        document.getElementById("speedVal").textContent = `${speed}/s`;
        syncSliderFill();
      });
      syncSliderFill();
      const btnKlein = document.getElementById("btnKlein");
      const btnTorus = document.getElementById("btnTorus");
      function setTopology(t) {
        topology = t;
        btnKlein.classList.toggle("active", t === "klein");
        btnTorus.classList.toggle("active", t === "torus");
      }
      btnKlein.addEventListener("click", () => setTopology("klein"));
      btnTorus.addEventListener("click", () => setTopology("torus"));

      const vP = document.getElementById("viewPaint"),
        vB = document.getElementById("viewBlocks"),
        vBoth = document.getElementById("viewBoth");
      function setView(v) {
        viewMode = v;
        vP.classList.toggle("active", v === "paint");
        vB.classList.toggle("active", v === "blocks");
        vBoth.classList.toggle("active", v === "both");
        applyView();
      }
      vP.addEventListener("click", () => setView("paint"));
      vB.addEventListener("click", () => setView("blocks"));
      vBoth.addEventListener("click", () => setView("both"));
      document.getElementById("erase").addEventListener("change", (e) => {
        eraseMode = e.target.checked;
      });

      // seed: a light ambient scatter plus recognizable named patterns, so the
      // life on the surface reads clearly from the very first frame
      randomSoup(0.045);
      stamp(PRESETS.glider, 30, 23);
      stamp(PRESETS.pulsar, 83, 50);
      stamp(PRESETS.gun, 63, 20);
      applyView();
      refreshTexture();
      updateStats();

      // ================= loop =================
      let last = performance.now(),
        acc = 0;
      function animate(now) {
        requestAnimationFrame(animate);
        const dt = Math.min(0.25, (now - last) / 1000);
        last = now;
        if (playing) {
          acc += dt;
          const interval = 1 / speed;
          let n = 0;
          while (acc >= interval && n < 8) {
            stepLife();
            acc -= interval;
            n++;
          }
          if (n === 8) acc = 0;
        }
        controls.update();
        vhsPass.uniforms.time.value = now / 1000;
        composer.render();
      }
      requestAnimationFrame(animate);

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
        bloom.setSize(window.innerWidth, window.innerHeight);
        vhsPass.uniforms.resolution.value.set(
          window.innerWidth,
          window.innerHeight,
        );
        vhsPass.uniforms.pixelRatio.value = renderer.getPixelRatio();
      });
    </script>
  </body>
</html>
